apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Version from package.json; versionCode = major·10000 + minor·100 + patch
// unless CI overrides it (Play rejects a repeated code)
def app_version = new JsonSlurper().parse( file( '../../../package.json' ) ).version
def version_parts = app_version.tokenize( '.-' ).take( 3 ).collect { it as int }
def version_code = ( System.getenv( 'ANDROID_VERSION_CODE' ) ?: ( version_parts[ 0 ] * 10000 + version_parts[ 1 ] * 100 + version_parts[ 2 ] ) ) as int

// Upload key for release builds: CI passes env vars, locally .secrets/android
// holds keystore.properties (both gitignored, see DOCUMENTATION.md)
def upload = new Properties()
def upload_properties = file( '../../../.secrets/android/keystore.properties' )
if( upload_properties.exists() ) upload_properties.withInputStream { upload.load( it ) }
def upload_store = System.getenv( 'ANDROID_KEYSTORE_PATH' ) ?: ( upload.storeFile ? "${ upload_properties.parent }/${ upload.storeFile }" : null )

android {
    namespace = "com.trueperformancenetwork.gratis"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.trueperformancenetwork.gratis"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode version_code
        versionName app_version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // llama.cpp is built for 64-bit ARM only (scripts/build_android_llama_server.sh)
        ndk { abiFilters 'arm64-v8a' }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // llama-server + ggml backends; extracted on install so the app can exec them
    sourceSets {
        main { jniLibs.srcDirs = [ '../../../vendor/android/jniLibs' ] }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    // Stable debug key (scripts/android_dev.sh creates it) so reinstalls keep
    // app data; without it (CI) the SDK's default debug key applies
    def dev_keystore = file( '../../../vendor/android/debug.keystore' )
    signingConfigs {
        dev {
            storeFile dev_keystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if( upload_store ) release {
            storeFile file( upload_store )
            storePassword System.getenv( 'ANDROID_KEYSTORE_PASSWORD' ) ?: upload.storePassword
            keyAlias System.getenv( 'ANDROID_KEY_ALIAS' ) ?: upload.keyAlias
            keyPassword System.getenv( 'ANDROID_KEY_PASSWORD' ) ?: upload.keyPassword
        }
    }
    buildTypes {
        debug { if( dev_keystore.exists() ) signingConfig signingConfigs.dev }
        release {
            if( upload_store ) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
