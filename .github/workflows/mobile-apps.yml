# Build the Android and iOS apps (Capacitor) with their llama.cpp servers.
# Android: release APK + AAB signed with the upload key. iOS: development
# .ipa for the devices in the "Gratis Development" profile
# (scripts/ios_signing.js). Artifacts only; nothing is published.

name: Mobile apps

on:
  push:
    branches: [mobile-apps]
  workflow_dispatch:

concurrency:
  group: mobile-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache llama.cpp build
        uses: actions/cache@v6
        with:
          path: vendor/android/.cache
          key: llama-android-${{ hashFiles('scripts/build_android_llama_server.sh') }}

      - name: Build llama-server (arm64-v8a)
        run: |
          sudo apt-get install -y ninja-build
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" CMAKE_BIN=/usr/bin scripts/build_android_llama_server.sh

      - name: Build signed APK + AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Without the keystore secret gradle leaves the release unsigned
          if [ -n '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
            echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          fi
          npm ci
          npm run build:native
          cd mobile/android && ./gradlew assembleRelease bundleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: gratis-android
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    env:
      SIGNED: ${{ secrets.IOS_DEV_P12_BASE64 != '' && secrets.IOS_DEV_P12_PASSWORD != '' && secrets.IOS_DEV_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache llama.cpp build
        uses: actions/cache@v6
        with:
          path: vendor/ios/.cache
          key: llama-ios-${{ hashFiles('scripts/build_ios_llama_server.sh', 'mobile/plugin/ios/LlamaServerShim/**') }}

      - name: Build llama-server (iphoneos arm64)
        run: |
          brew install ninja
          scripts/build_ios_llama_server.sh

      # Throwaway keychain with the development identity + its profile
      - name: Install signing identity
        if: env.SIGNED == 'true'
        env:
          P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo '${{ secrets.IOS_DEV_P12_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/dev.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $( security list-keychains -d user | tr -d '"' )
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo '${{ secrets.IOS_DEV_PROFILE_BASE64 }}' | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/gratis-dev.mobileprovision

      - name: Build .ipa
        run: |
          npm ci
          npm run build:native

          # No identity yet: unsigned Payload/App.app zip, signable with zsign
          if [ "$SIGNED" != true ]; then
            xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
            mkdir -p build/ipa/Payload
            cp -R build/ios/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
            ( cd build/ipa && zip -qry gratis-unsigned.ipa Payload )
            exit 0
          fi

          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios -archivePath build/Gratis.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Apple Development" PROVISIONING_PROFILE_SPECIFIER="Gratis Development" \
            archive
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>debugging</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.trueperformancenetwork.gratis</key><string>Gratis Development</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Gratis.xcarchive -exportPath build/ipa -exportOptionsPlist build/ExportOptions.plist

      - uses: actions/upload-artifact@v5
        with:
          name: gratis-ios
          path: build/ipa/*.ipa

      - name: Remove keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
