# Deploy web app to Cloudflare Workers (Static Assets) when web changes
# land on main. Project name is defined in wrangler.toml.
#
# Requires:
#   Secrets  — CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - .env
      - .github/workflows/deploy-web.yml
      - index.html
      - package.json
      - package-lock.json
      - public/**
      - src/**
      - vite.config.js
      - wrangler.toml
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  # ── Build & deploy to Cloudflare Workers (Static Assets) ──
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build
        run: npm run build

      - name: Verify COOP/COEP headers file
        run: |
          if [ ! -f dist/_headers ]; then
            echo "::error::dist/_headers missing — SharedArrayBuffer will not work"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
