# Deploy web app to Cloudflare Workers (Static Assets) when web files
# change on main. Project name is defined in wrangler.toml.
#
# Requires:
#   Secrets  — CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - ".env"
      - ".github/workflows/deploy-web.yml"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/verify_deployment_headers.js"
      - "src/**"
      - "tests/pwa/**"
      - "vite.config.js"
      - "wrangler.toml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  # ── Build & deploy to Cloudflare Workers (Static Assets) ──
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production PWA
        run: npm run test:pwa

      - name: Build
        run: npm run build

      - name: Verify COOP/COEP headers file
        run: |
          set -euo pipefail
          cmp public/_headers dist/_headers
          grep --fixed-strings --quiet "Cross-Origin-Opener-Policy: same-origin" dist/_headers
          grep --fixed-strings --quiet "Cross-Origin-Embedder-Policy: require-corp" dist/_headers

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: deploy

      - name: Verify deployed security headers
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs['deployment-url'] }}
          PUBLIC_URL: ${{ vars.PUBLIC_WEB_ORIGIN || (github.repository == 'actuallymentor/gratis-ai' && 'https://ai.gratis.sh') || '' }}
          LOG_LEVEL: info
        run: node scripts/verify_deployment_headers.js "$DEPLOYMENT_URL" "$PUBLIC_URL"
