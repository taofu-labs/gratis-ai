# Deploy web app to Cloudflare Workers (Static Assets) when a version
# bump lands on main.  Project name is defined in wrangler.toml.
#
# Requires:
#   Secrets  — CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Web

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  # ── Gate: only proceed when the version string actually changed ──
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare version with previous revision
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          CURR=$(node -p "require('./package.json').version")
          echo "version=$CURR" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            echo "::notice::No previous package.json; treating this as a version change"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV=$(git show "${BEFORE_SHA}:package.json" |
            node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "previous=$PREV current=$CURR"

          if [ "$PREV" != "$CURR" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build & deploy to Cloudflare Workers (Static Assets) ──
  deploy:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production PWA
        run: npm run test:pwa

      - name: Build
        run: npm run build

      - name: Verify COOP/COEP headers file
        run: |
          set -euo pipefail
          cmp public/_headers dist/_headers
          grep --fixed-strings --quiet "Cross-Origin-Opener-Policy: same-origin" dist/_headers
          grep --fixed-strings --quiet "Cross-Origin-Embedder-Policy: require-corp" dist/_headers

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: deploy

      - name: Verify deployed security headers
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs['deployment-url'] }}
          PUBLIC_URL: ${{ vars.PUBLIC_WEB_ORIGIN || (github.repository == 'actuallymentor/gratis-ai' && 'https://ai.gratis.sh') || '' }}
          LOG_LEVEL: info
        run: node scripts/verify_deployment_headers.js "$DEPLOYMENT_URL" "$PUBLIC_URL"
