appId: com.trueperformancenetwork.gratis
productName: Gratis
directories:
  output: release/

# node-llama-cpp needs filesystem access for native .node binaries and mmap'd model files
asar: true
asarUnpack:
  - "node_modules/node-llama-cpp/**"
  - "node_modules/@node-llama-cpp/**"

# Vision sidecar: llama.cpp llama-server + its shared libraries, fetched per
# platform/arch by scripts/fetch_llama_server.js (run before packaging).
# Lands in <resources>/llama-server, outside the asar, where electron/llama_server.js
# looks for it.
#
# macOS signing: @electron/osx-sign walks the whole .app (Contents/Resources
# included) and signs every Mach-O file it finds, so llama-server and its dylibs
# get our Developer ID, hardened runtime and `entitlementsInherit` like any helper.
# The dylibs are plain files (no symlinks) named by their @rpath install names, so
# re-signing keeps library validation happy and notarization sees no unsigned code.
extraResources:
  - from: "vendor/llama-server/${os}-${arch}"
    to: "llama-server"
    filter:
      - "**/*"
      - "!.version"

publish:
  provider: github
  owner: taofu-labs
  repo: gratis-ai

# --- macOS ---
mac:
  category: public.app-category.productivity
  artifactName: "Gratis-mac-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # Info.plist comes from `mac:` for the mas build too (mas.extendInfo is ignored)
  extendInfo:
    # App Store only, inert in the DMG: HTTPS-only app is export-compliance exempt,
    # so App Store Connect skips the encryption question on every upload
    ITSAppUsesNonExemptEncryption: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

# --- Mac App Store (`electron-builder --mac mas --arm64`, see release-mac-app-store.yml) ---
# Inherits `mac:` above, so everything that differs is overridden here.
# Signing: CSC_LINK (Apple Distribution / 3rd Party Mac Developer Application .p12) signs the
# app, CSC_INSTALLER_LINK (3rd Party Mac Developer Installer .p12) signs the .pkg.
# The provisioning profile is a secret: pass `-c.mas.provisioningProfile=<path>` (never committed).
# arm64 only: Intel Macs keep the DMG; a universal build would have to lipo llama-server.
mas:
  artifactName: "Gratis-mas-${arch}.${ext}"
  # Sandboxed instead of hardened; on, the inherit-only helpers would lose V8's JIT rights
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist

# --- Windows ---
win:
  artifactName: "Gratis-win.${ext}"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# --- Linux ---
linux:
  category: Utility
  artifactName: "Gratis-linux.${ext}"
  target:
    - target: AppImage
      arch:
        - x64
