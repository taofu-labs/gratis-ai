# Cloudflare Workers Static Assets — serves the built web app.
# Deployed by the "Deploy Web" GitHub Action when web files change.
#
# The project name here must match the application name in the
# Cloudflare dashboard (Workers & Pages → Applications).

name = "gratis-trueperformancenetwork"
compatibility_date = "2026-02-24"

# Domains live in Cloudflare, not here (with no `routes` key, deploys leave them alone):
#   gratis.trueperformancenetwork.com  proxied DNS record + Worker route (CI token has no access to that zone's routes)
#   gratis-ai.com, www.gratis-ai.com   Workers custom domains on this Worker (attached 2026-10-30)
# Adding `routes` makes wrangler treat it as the full set and try to rewrite all of them.

[assets]
directory = "./dist"

# SPA routing — serve index.html for any path that doesn't match a static file.
# Without this, direct navigation to /chat or lazy-loaded chunks on sub-routes 404.
not_found_handling = "single-page-application"
